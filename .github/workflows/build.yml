name: 'Unzip and build plugin jar'

# Drop this file at .github/workflows/build.yml in a repo that also has
# the project's .zip file sitting in the repo root. On every push (or
# manual "Run workflow" from the Actions tab), this unzips it, finds the
# Gradle project inside, builds it, and uploads the resulting jar as a
# downloadable artifact. No secrets/tokens needed.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No .zip file found in the repo root!"
            exit 1
          fi
          echo "Unzipping $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted

      - name: Find project directory
        id: find_dir
        run: |
          PROJECT_DIR=$(find extracted -maxdepth 4 -name "build.gradle.kts" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find build.gradle.kts anywhere under extracted/"
            exit 1
          fi
          echo "Found project at $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x "${{ steps.find_dir.outputs.project_dir }}/gradlew"

      - name: Build
        working-directory: ${{ steps.find_dir.outputs.project_dir }}
        run: ./gradlew build --stacktrace

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: BreweryGuiEditor-jar
          path: ${{ steps.find_dir.outputs.project_dir }}/build/libs/*.jar
          if-no-files-found: error
